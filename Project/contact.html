<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leo Das | Contact Me</title>

    <!-- F A V I C O N -->
    <link rel="icon" href="Assets/Images/logo2.png" type="image/x-icon" />

    <!-- M E T A  T A G S -->
    <meta
      name="description"
      content="Contact Leo Das, Tech Innovator and Entrepreneur. Let's collaborate on your next big project!"
    />
    <meta
      name="keywords"
      content="Leo Das, Contact, Tech Innovator, Collaboration, Tech Innovate"
    />
    <meta name="author" content="Leo Das" />

    <!-- O P E N  G R A P H  T A G S  F O R  S O C I A L  M E D I A -->
    <meta property="og:title" content="Contact Leo Das | Tech Innovator" />
    <meta
      property="og:description"
      content="Get in touch with Leo Das, a tech innovator with a passion for collaboration on innovative projects."
    />
    <meta property="og:image" content="Assets/Images/logo2.png" />
    <meta property="og:url" content="https://www.yourwebsite.com/contact" />
    <meta property="og:type" content="website" />

    <!-- T W I T T E R  C A R D  T A G S -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact Leo Das | Tech Innovator" />
    <meta
      name="twitter:description"
      content="Connect with Leo Das for your next tech innovation project."
    />
    <meta name="twitter:image" content="Assets/Images/logo2.png" />

    <!-- E X T E R N A L  C S S -->
    <link rel="stylesheet" type="text/css" href="Assets/css/contact.css" />
    <link rel="stylesheet" type="text/css" href="Assets/css/template.css" />

    <!-- B O X  I C O N  L I N K -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@latest/css/boxicons.min.css"
    />

    <!-- R E M I X  I C O N  L I N K -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- G O O G L E  F O N T S  L I N K -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Acme&family=Alice&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- H E A D E R  S T A R T -->
    <div id="header-placeholder"></div>
    <!-- H E A D E R  E N D -->

    <!-- C O N T A C T  S E C T I O N  S T A R T -->
    <section class="contact" id="contact">
      <!-- M A I N  C O N T A C T  D E T A I L S -->
      <div class="contact-main">
        <a href="#" class="h-line">
          <i class="ri-shining-2-line"></i>
          <span>Contact!</span>
        </a>
        <h2>Have A Project In Mind? <span>Let's Collaborate!</span></h2>

        <!-- E M A I L  D E T A I L -->
        <div class="email">
          <p>Email:</p>
          <h6>leodas01@gmail.com</h6>
        </div>

        <!-- P H O N E  N U M B E R -->
        <div class="num">
          <p>Call:</p>
          <h6>+65 2345 0987</h6>
        </div>

        <!-- S O C I A L  M E D I A  L I N K S -->
        <div class="social-icons">
          <a
            href="https://dribbble.com"
            aria-label="Dribbble"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="ri-dribbble-line"></i>
          </a>
          <a
            href="https://x.com"
            aria-label="Twitter"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="ri-twitter-x-fill"></i>
          </a>
          <a
            href="https://www.instagram.com/accounts/login/"
            aria-label="Instagram"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="ri-instagram-line"></i>
          </a>
          <a
            href="https://en-gb.facebook.com"
            aria-label="Facebook"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="ri-facebook-fill"></i>
          </a>
          <a
            href="https://www.pinterest.com"
            aria-label="Pinterest"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="ri-pinterest-fill"></i>
          </a>
        </div>
      </div>

      <!-- C O N T A C T  F O R M -->
      <form class="contact-form">
        <input type="text" placeholder="Your Name" required />
        <input type="email" name="" placeholder="Email address..." required />
        <textarea
          name=""
          id=""
          cols="30"
          rows="10"
          placeholder="Write Message here..."
          required
        ></textarea>
        <input type="submit" value="Submit Now" class="submit-btn" />
      </form>
    </section>
    <!-- C O N T A C T  S E C T I O N  E N D -->

    <!-- F O O T E R  S T A R T -->
    <div id="footer-placeholder"></div>
    <!-- F O O T E R  E N D -->

    <!-- J S  F I L E S -->
    <script src="Assets/JS/template.js"></script>
  </body>
</html>
